[project]
name = "generathon"
version = "0.1.0"
description = "Score-to-cinema AI directing tool for electronic music and auteur visual shorts."
requires-python = ">=3.14,<3.15"
dependencies = [
    "google-genai>=2.0,<3",
    "librosa>=0.11,<0.12",
    "openai>=2.0,<3",
    "python-dotenv>=1.0,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
